name: Publicar StreamPlay

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publicar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Preparar arquivos
        run: |
          rm -rf public
          mkdir -p public
          unzip -o app/StreamPlay-2.0-FINAL.zip -d public

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar publicação
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Publicar no GitHub Pages
        uses: actions/deploy-pages@v4
